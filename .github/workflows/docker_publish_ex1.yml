name: Docker Image Publish
on:
    workflow_dispatch:
        inputs:
            version:                            # 워크플로 실행 시에 버전 지정
                type: string
                required: true
                description: version (ex) 1.2.3)
env:                                            # 컨테이너 이미지명
    IMAGE_NAME: gha-image
jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            packages: write                     # 깃허브 패키지에 쓰기 권한 부여
            contents: read                      # 소스 코드 체크아웃 허가
        steps:
            - uses: actions/checkout@v4
            - uses: docker/login-action@v3      # 컨테이너 레지스트리 로그인
              with:
                registry: ghcr.io               # 컨테이너 레지스트리의 호스트명
                username: ${{github.actor}}     # 컨테이너 레지스트리의 로그인 ID
                password: ${{secrets.GITHUB_TOKEN}} # 컨테이너 레지스트리의 로그인 패스워드
            - uses: docker/metadata-action@v5   # 컨테이너 이미지 메타데이터 생성
              id: meta
              with:                             # 이미지명은 컨테이너 레지스트리의 명명 규칙을 따름
                images: ghcr.io/${{github.repository_owner}}/${{env.IMAGE_NAME}}
                tags: |                         # 시맨틱 2 형식의 이미지 태그와 latest 태그 정의
                  type=semver, pattern={{version}}, value=v${{inputs.version}}
                  type=raw, value=latest
            - uses: docker/build-push-action@v5 # 컨테이너 이미지 빌드와 푸시
              with:
                push: true                      # 푸시 처리 제어
                context: docker/example1/       # 컨테이너 이미지의 컨텍스트
                tags: ${{steps.meta.outputs.tags}}  # 컨테이너 이미지의 태그
                labels: ${{steps.meta.outputs.labels}}  # 컨테이너 이미지의 레이블
